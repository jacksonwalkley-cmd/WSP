<title>Grant Wenger Clicker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: Friday-night scoreboard up top, the player in the middle of the field, the depth chart (shop) beside it. */
:root {
  color-scheme: dark;
  --night: #0a1630;        /* stadium sky */
  --turf: #123d2a;         /* field */
  --panel: #10214a;        /* scoreboard steel */
  --blue: #1f5fd1;         /* Loyola blue */
  --gold: #f5b81c;         /* Loyola gold */
  --chalk: #f2f4f8;        /* yard-line white */
  --muted: #9fb0d4;
  --display: "Press Start 2P", "Courier New", monospace;
  --body: "VT323", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse 70% 40% at 20% 0%, rgba(255,255,230,.10), transparent 70%),
    radial-gradient(ellipse 70% 40% at 80% 0%, rgba(255,255,230,.10), transparent 70%),
    var(--night);
  color: var(--chalk);
  font: 400 21px/1.2 var(--body);
  padding-inline: 16px;
  padding-block: 16px 40px;
  overflow-x: hidden;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }

/* Scoreboard */
.board {
  background: var(--panel);
  border: 3px solid var(--gold);
  border-radius: 0;
  padding: 14px 18px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 16px;
  align-items: end;
}
.board h1 {
  grid-column: 1 / -1;
  margin: 0;
  font: 400 clamp(14px, 3.4vw, 22px)/1.3 var(--display);
  color: var(--gold);
  letter-spacing: .04em;
  text-wrap: balance;
}
.score {
  font: 400 clamp(26px, 7vw, 46px)/1.1 var(--display);
  font-variant-numeric: tabular-nums;
  color: var(--chalk);
  text-shadow: 0 0 18px rgba(245,184,28,.35);
  min-width: 0;
  overflow-wrap: anywhere;
}
.score small { display: block; font: 600 14px/1.2 var(--body); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; text-shadow: none; }
.rate { text-align: right; font-size: 15px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.rate b { display: block; color: var(--gold); font: 400 16px/1.4 var(--display); letter-spacing: 0; font-variant-numeric: tabular-nums; }

/* Field */
.game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 20px; }
@media (max-width: 760px) { .game { grid-template-columns: minmax(0, 1fr); } }
.field {
  position: relative;
  border-radius: 0;
  min-height: 420px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background:
    repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(255,255,255,.18) calc(10% - 2px) 10%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 5%, transparent 5% 10%),
    var(--turf);
}
.yard { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: space-around; font: 400 9px var(--display); color: rgba(255,255,255,.35); pointer-events: none; }
#player {
  position: relative;
  max-width: 100%;
  aspect-ratio: 2 / 3;
  width: min(240px, 60vw);
  background: transparent;
  border: 0;
  cursor: pointer;
  animation: bob 1s steps(2) infinite;
  transition: transform .08s ease-out;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  padding: 0;
}
#player canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; filter: drop-shadow(0 8px 0 rgba(0,0,0,.35)); }
@keyframes bob { 50% { translate: 0 -6px; } }
#player:hover { transform: scale(1.03); }
#player:active { transform: scale(.94); }
#player:focus-visible { outline: 4px dashed var(--chalk); outline-offset: 10px; }
.hint { position: absolute; top: 12px; left: 0; right: 0; text-align: center; color: var(--chalk); letter-spacing: .14em; text-transform: uppercase; font-size: 14px; opacity: .8; pointer-events: none; }
.pop {
  position: absolute; pointer-events: none;
  font: 400 16px var(--display); color: var(--gold);
  text-shadow: 0 2px 0 #000;
  animation: rise 0.9s ease-out forwards;
}
@keyframes rise { to { transform: translateY(-80px); opacity: 0; } }
#ball {
  position: absolute; width: 56px; height: 34px; border: 0; padding: 0; cursor: pointer;
  border-radius: 50%; background: #7a3e17;
  box-shadow: inset 0 0 0 2px #4a2209, 0 0 18px 6px rgba(245,184,28,.7);
  animation: wobble 1s ease-in-out infinite alternate;
}
#ball::after { content: ""; position: absolute; left: 18px; right: 18px; top: 15px; height: 4px; background: var(--chalk); border-radius: 2px; }
@keyframes wobble { from { transform: rotate(-20deg); } to { transform: rotate(20deg) translateY(-6px); } }
.banner { position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--night); padding: 4px 14px; border-radius: 3px; font: 400 10px/1.6 var(--display); white-space: nowrap; }

/* Depth chart / shop */
.shop { display: grid; gap: 10px; align-content: start; }
.shop h2 { margin: 4px 0 0; font: 400 12px var(--display); color: var(--gold); letter-spacing: .06em; }
.item {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--panel); color: var(--chalk);
  border: 2px solid rgba(159,176,212,.25); border-radius: 0;
  padding: 10px 12px; font: inherit;
}
.item:hover:not(:disabled) { border-color: var(--gold); }
.item:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.item:disabled { opacity: .45; cursor: not-allowed; }
.item .name { font-size: 24px; min-width: 0; }
.item .own { font: 400 16px var(--display); color: var(--gold); grid-row: span 2; font-variant-numeric: tabular-nums; }
.item .desc { font-size: 18px; color: var(--muted); min-width: 0; }
.item .cost { color: var(--gold); font-variant-numeric: tabular-nums; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
.foot button { background: transparent; color: var(--muted); border: 1px solid currentColor; border-radius: 4px; padding: 6px 12px; font: inherit; cursor: pointer; }
.foot button.arm { color: #ff7a6b; }
@media (prefers-reduced-motion: reduce) {
  #player, #ball, .pop { transition: none; animation: none; }
  .pop { opacity: 1; }
}
</style>

<div class="wrap">
  <header class="board">
    <h1>GRANT WENGER CLICKER</h1>
    <div class="score"><small>Tackles</small><span id="score">0</span></div>
    <div class="rate">per second<b id="rate">0</b>per click<b id="perClick">1</b></div>
  </header>

  <main class="game">
    <section class="field" id="field" aria-label="Field">
      <div class="hint">Insert coin · tap #62</div>
      <button id="player" aria-label="Click Grant Wenger"><canvas id="sprite" width="24" height="36"></canvas></button>
      <div class="yard"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>40</span><span>30</span><span>20</span><span>10</span></div>
    </section>

    <aside class="shop">
      <h2>Upgrades</h2>
      <div id="clickShop" style="display:grid;gap:10px"></div>
      <h2>Depth Chart</h2>
      <div id="autoShop" style="display:grid;gap:10px"></div>
    </aside>
  </main>

  <footer class="foot">
    <span id="stats">Total tackles: 0</span>
    <button id="reset" type="button">Reset season</button>
  </footer>
</div>

<script>
(() => {
  const SAVE = "n62-clicker-v1";
  const AUTO = [
    { id: "waterboy", name: "Water Boy",        desc: "Keeps #62 hydrated", base: 15,      cps: 0.1 },
    { id: "lineman",  name: "D-Line Buddy",     desc: "Clogs the gaps",     base: 100,     cps: 1 },
    { id: "coach",    name: "Position Coach",   desc: "Film every night",   base: 1100,    cps: 8 },
    { id: "weights",  name: "Weight Room",      desc: "Squat 500",          base: 12000,   cps: 47 },
    { id: "playbook", name: "Blitz Playbook",   desc: "Send everybody",     base: 130000,  cps: 260 },
    { id: "boosters", name: "Booster Club",     desc: "New helmets for all",base: 1.4e6,   cps: 1400 },
    { id: "stadium",  name: "Friday Night Lights", desc: "The whole town shows up", base: 2e7, cps: 7800 },
  ];
  const CLICK = [
    { id: "gloves",  name: "Sticky Gloves",   desc: "+1 per click",  base: 50,    add: 1 },
    { id: "pads",    name: "New Shoulder Pads", desc: "+5 per click", base: 750,   add: 5 },
    { id: "helmet",  name: "Gold Helmet",     desc: "+25 per click", base: 9000,  add: 25 },
    { id: "beast",   name: "Beast Mode",      desc: "+150 per click", base: 120000, add: 150 },
  ];

  let s = { score: 0, total: 0, owned: {} };
  try { const raw = localStorage.getItem(SAVE); if (raw) s = Object.assign(s, JSON.parse(raw)); } catch (e) {}
  if (window.claude?.hot?.data?.s) s = window.claude.hot.data.s;
  window.claude?.hot?.snapshot?.(() => ({ s }));

  const $ = id => document.getElementById(id);

  // Pixel #62: left half of a front-facing sprite, mirrored; the number is stamped on after.
  const HALF = [
    "........KKKK","......KKGGGB",".....KGGGGGB","....KGGGGGGB","....KGgGGGGB","...KGgGGGGGB",
    "...KGgGKKKKK","...KGgKSSSSS","...KGgKMMMMM","...KGgKSKSSS","...KggKMMMMM","....KgKSSSSS",
    "....KKKMMMMM",".....KKKSSSs","....KKKKKSSs","..KKBBBBKWWW",".KBBBBBBBWWW","KBBbBBBBBWWW",
    "KBBbBBBBWWWW","KBbbBBBWWWWW","KWWWWKWWWWWW","KWWWWKWWWWWW","KYYYYKWWWWWW","KBBBBKWWWWWW",
    "KWWWWKWWWWWW","KBBBBKWWWWWW","KBBBBKwwwwww",".KKKKKBBBBBB",".....KBBBBBB",".....KYBBBBB",
    ".....KYBBBBK",".....KYBBBK.",".....KWWWWK.",".....KWWWWK.","....KKKKKKK.","....KKKKKKK."
  ];
  const PAL = { K:"#0b1020", G:"#f5b81c", g:"#c48a0a", B:"#1f5fd1", b:"#133c8f", M:"#1f5fd1",
                S:"#f1c09a", s:"#d49a76", W:"#f2f4f8", w:"#c9d2e3", Y:"#f5b81c" };
  const DIGITS = { "6": ["BBB","B..","BBB","B.B","BBB"], "2": ["BBB","..B","BBB","B..","BBB"] };
  (function drawSprite() {
    const ctx = $("sprite").getContext("2d");
    HALF.forEach((row, y) => {
      const full = row + [...row].reverse().join("");
      [...full].forEach((c, x) => { if (PAL[c]) { ctx.fillStyle = PAL[c]; ctx.fillRect(x, y, 1, 1); } });
    });
    [["6", 8], ["2", 13]].forEach(([d, x0]) => DIGITS[d].forEach((row, dy) =>
      [...row].forEach((c, dx) => { if (c === "B") { ctx.fillStyle = PAL.B; ctx.fillRect(x0 + dx, 20 + dy, 1, 1); } })));
  })();
  const own = id => s.owned[id] || 0;
  const cost = it => Math.ceil(it.base * Math.pow(1.15, own(it.id)));
  const cps = () => AUTO.reduce((t, it) => t + it.cps * own(it.id), 0);
  const perClick = () => 1 + CLICK.reduce((t, it) => t + it.add * own(it.id), 0) + Math.floor(cps() * 0.01);
  let frenzy = 0; // timestamp until which clicks are x7

  const fmt = n => {
    if (n < 1000) return (Math.round(n * 10) / 10).toLocaleString();
    const u = ["", "K", "M", "B", "T", "Qa", "Qi"];
    let i = 0; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + u[i];
  };

  function buildShop(list, el) {
    el.innerHTML = "";
    for (const it of list) {
      const b = document.createElement("button");
      b.className = "item"; b.id = "buy-" + it.id; b.type = "button";
      b.innerHTML = `<span class="name">${it.name}</span><span class="own"></span>
        <span class="desc">${it.desc}${it.cps ? ` · ${fmt(it.cps)}/s` : ""} · <span class="cost"></span></span>`;
      b.addEventListener("click", () => {
        const c = cost(it);
        if (s.score < c) return;
        s.score -= c; s.owned[it.id] = own(it.id) + 1; render();
      });
      el.appendChild(b);
    }
  }
  buildShop(CLICK, $("clickShop"));
  buildShop(AUTO, $("autoShop"));

  function render() {
    $("score").textContent = fmt(Math.floor(s.score));
    $("rate").textContent = fmt(cps());
    $("perClick").textContent = fmt(perClick() * (Date.now() < frenzy ? 7 : 1));
    $("stats").textContent = "Total tackles: " + fmt(Math.floor(s.total));
    for (const it of [...CLICK, ...AUTO]) {
      const b = $("buy-" + it.id);
      b.querySelector(".own").textContent = own(it.id);
      b.querySelector(".cost").textContent = fmt(cost(it)) + " tackles";
      b.disabled = s.score < cost(it);
    }
    document.title = fmt(Math.floor(s.score)) + " tackles · Grant Wenger Clicker";
  }

  function pop(x, y, text) {
    const p = document.createElement("div");
    p.className = "pop"; p.textContent = text;
    const r = $("field").getBoundingClientRect();
    p.style.left = (x - r.left - 20 + (Math.random() * 30 - 15)) + "px";
    p.style.top = (y - r.top - 20) + "px";
    $("field").appendChild(p);
    setTimeout(() => p.remove(), 900);
  }

  $("player").addEventListener("click", e => {
    const gain = perClick() * (Date.now() < frenzy ? 7 : 1);
    s.score += gain; s.total += gain;
    let x = e.clientX, y = e.clientY;
    if (!x && !y) { const r = $("player").getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
    pop(x, y, "+" + fmt(gain));
    render();
  });

  // Golden football: shows up now and then, click it for a bonus
  function spawnBall() {
    const f = $("field"), b = document.createElement("button");
    b.id = "ball"; b.type = "button"; b.setAttribute("aria-label", "Grab the golden football");
    b.style.left = (10 + Math.random() * 75) + "%";
    b.style.top = (15 + Math.random() * 60) + "%";
    b.addEventListener("click", e => {
      b.remove();
      if (Math.random() < 0.5) {
        frenzy = Date.now() + 20000;
        banner("FUMBLE RECOVERY! Clicks x7 for 20s");
      } else {
        const bonus = Math.max(25, cps() * 60 + perClick() * 15);
        s.score += bonus; s.total += bonus;
        pop(e.clientX, e.clientY, "+" + fmt(bonus));
        banner("PICK SIX! +" + fmt(bonus));
      }
      render();
    });
    f.appendChild(b);
    setTimeout(() => b.remove(), 9000);
    setTimeout(spawnBall, 40000 + Math.random() * 50000);
  }
  function banner(t) {
    const d = document.createElement("div"); d.className = "banner"; d.textContent = t;
    $("field").appendChild(d); setTimeout(() => d.remove(), 3000);
  }
  setTimeout(spawnBall, 25000);

  let armed = false;
  $("reset").addEventListener("click", () => {
    if (!armed) { armed = true; $("reset").textContent = "Tap again to wipe everything"; $("reset").classList.add("arm");
      setTimeout(() => { armed = false; $("reset").textContent = "Reset season"; $("reset").classList.remove("arm"); }, 3000); return; }
    s = { score: 0, total: 0, owned: {} }; armed = false;
    $("reset").textContent = "Reset season"; $("reset").classList.remove("arm"); render();
  });

  let last = performance.now();
  setInterval(() => {
    const now = performance.now(), g = cps() * (now - last) / 1000; last = now;
    s.score += g; s.total += g; render();
  }, 100);
  setInterval(() => { try { localStorage.setItem(SAVE, JSON.stringify(s)); } catch (e) {} }, 3000);
  render();
})();
</script>
